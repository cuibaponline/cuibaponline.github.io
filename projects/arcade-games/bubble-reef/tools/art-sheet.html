<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bubble Reef art sheet</title>
    <style>
      html, body { margin: 0; background: #0d4a70; color: #dff3ff; font: 13px/1.3 system-ui, sans-serif; }
      h2 { margin: 18px 12px 6px; font-size: 15px; }
      .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px; padding: 4px 12px; }
      .cell { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
      .cell span { font-size: 11px; opacity: 0.8; }
      canvas { display: block; }
      #log { padding: 8px 12px; white-space: pre; font: 12px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="log"></div>
    <div id="out"></div>
    <script type="module" src="./art-sheet.ts"></script>
  </body>
</html>
