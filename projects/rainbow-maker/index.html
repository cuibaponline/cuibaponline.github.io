<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}</style>

<style>
/* Layout: one full-bleed 3D meadow with floating toy-like panels. Three arrangements:
   tall screens (phones upright) stack the hint card on top and the tray at the bottom;
   wide screens (laptops, projectors) put the hint top-left and the tray bottom-right so the rainbow and the child stay clear;
   short wide screens (phones sideways) use the same corners in a compact size. All sizes are in rem and the root size grows with the screen. */
:root {
  --ink: #1c2547;
  --muted: #56617f;
  --panel: rgba(255, 255, 255, 0.9);
  --panel-solid: #ffffff;
  --line: rgba(28, 37, 71, 0.14);
  --sun: #ffc83a;
  --sun-deep: #e59a00;
  --rain: #2f7cf6;
  --leaf: #23945f;
  --sky: #9fcbf2;
  --display: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --body: "Andika", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --gut: 1rem;
  color-scheme: light;
}
html { font-size: clamp(16px, 1.9vmin, 30px); }
html, body { height: 100%; }
body { background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden; }
#app { position: fixed; inset: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene:active { cursor: grabbing; }

button { font-family: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 0.2rem solid var(--rain); outline-offset: 0.2rem; }

/* Header */
.overlay-top {
  position: absolute; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 0.75rem) max(var(--gut), env(safe-area-inset-right, 0px)) 0 max(var(--gut), env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 0.6rem; pointer-events: none;
}
.top { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; }
.brand { pointer-events: auto; min-width: 0; }
.brand h1 {
  margin: 0; font-family: var(--display); font-weight: 800; line-height: 1;
  font-size: 2.3rem; letter-spacing: 0.01em; white-space: nowrap;
  text-shadow: 0 0.12rem 0 #fff, 0 0.2rem 0.6rem rgba(28, 37, 71, 0.25);
}
.brand h1 span:nth-child(7n+1) { color: #e8322b; }
.brand h1 span:nth-child(7n+2) { color: #f07d00; }
.brand h1 span:nth-child(7n+3) { color: #e2b100; }
.brand h1 span:nth-child(7n+4) { color: #1f9d4c; }
.brand h1 span:nth-child(7n+5) { color: #1f6ff0; }
.brand h1 span:nth-child(7n+6) { color: #4b3fcf; }
.brand h1 span:nth-child(7n+7) { color: #9b39d6; }
.brand p { margin: 0.25rem 0 0; font-size: 0.95rem; font-weight: 700; color: var(--ink); text-shadow: 0 1px 0 rgba(255,255,255,.9), 0 0 0.5rem rgba(255,255,255,.7); }
.top-actions { display: flex; gap: 0.5rem; pointer-events: auto; flex-shrink: 0; }
.chip-btn {
  border: 0; background: var(--panel); border-radius: 999px; min-height: 2.75rem; min-width: 2.75rem;
  padding: 0 0.85rem; font-weight: 700; font-size: 0.9rem; box-shadow: 0 0.12rem 0.5rem rgba(28,37,71,.15);
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
}
.chip-btn[aria-pressed="true"] { background: var(--ink); color: #fff; }
.chip-btn .lbl { display: none; }
.chip-btn .ic svg { width: 20px; height: 20px; display: block; }
.lk-banner-float { pointer-events: auto; margin: 0 auto 0.5rem; max-width: 30rem; }
.lang-long { display: none; }
#fsBtn, #cleanBtn { display: none; }

/* Hint card */
.hint {
  pointer-events: auto; width: min(35rem, 100%);
  background: var(--panel); border-radius: 1.4rem; padding: 0.75rem 1rem;
  box-shadow: 0 0.4rem 1.5rem rgba(28,37,71,.18);
  display: grid; gap: 0.6rem;
}
.checks { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.check {
  display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.6rem 0.25rem 0.35rem;
  border-radius: 999px; background: #eef1f7; font-size: 0.82rem; font-weight: 700; color: var(--muted);
  transition: background .3s, color .3s;
}
.check .dot { width: 1.4rem; height: 1.4rem; border-radius: 50%; display: grid; place-items: center; background: #d6dbe7; color: #fff; font-size: 0.8rem; }
.check.ok { background: #dff5e8; color: #17603e; }
.check.ok .dot { background: var(--leaf); }
.check .t { display: none; }
.msg { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.3rem; line-height: 1.2; text-wrap: balance; }
.msg-row { display: flex; gap: 0.6rem; align-items: center; }
.msg-row .msg { flex: 1; min-width: 0; }
.msgs { flex: 1; min-width: 0; } .msgs .msg + .msg { margin-top: 0.2rem; } #msgEn:not([hidden]) + #msg { color: #2c68b2; font-weight: 600; }   /* both languages: Vietnamese line in blue, as in Color Lab */
#hint.lk-collapsed > .msg-row { display: flex !important; } #hint.lk-collapsed .msgs { display: none !important; }
#hint.lk-collapsed .hear { position: relative; z-index: 3; }   /* above the fold button's enlarged tap area */
.hear { border: 0; background: var(--sun); width: 3.25rem; height: 3.25rem; border-radius: 50%; font-size: 1.5rem; flex-shrink: 0; box-shadow: 0 0.12rem 0 var(--sun-deep); }
.hear:active { transform: translateY(0.12rem); box-shadow: none; }
.voice-note { margin: 0; font-size: 0.85rem; color: var(--muted); }
.hint.win .checks { display: none; }
.hint.win { box-shadow: 0 0 0 0.25rem var(--sun), 0 0.4rem 1.5rem rgba(28,37,71,.2); }
.legend { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.legend button {
  border: 0; border-radius: 0.75rem; padding: 0.3rem 0.65rem; font-weight: 700; font-size: 0.9rem; color: #fff;
  text-shadow: 0 1px 1px rgba(0,0,0,.25); min-height: 2.1rem;
}

/* Control tray */
.controls {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 max(var(--gut), env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 0.9rem) max(var(--gut), env(safe-area-inset-left, 0px));
  display: flex; justify-content: center; pointer-events: none;
}
.tray {
  pointer-events: auto; width: min(40rem, 100%);
  background: var(--panel); border-radius: 1.6rem; padding: 0.75rem;
  box-shadow: 0 0.5rem 1.9rem rgba(28,37,71,.22);
  display: grid; gap: 0.6rem;
}
.toggles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.4rem; }
.tog {
  border: 0.125rem solid var(--line); background: var(--panel-solid); border-radius: 1.1rem;
  min-height: 4.5rem; padding: 0.35rem 0.2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1rem;
  font-family: var(--display); font-weight: 800; font-size: 1rem; line-height: 1.1; min-width: 0;
  white-space: nowrap; transition: transform .12s, background .2s, border-color .2s;
}
.tog .ic { font-size: 1.8rem; line-height: 1; }
.tog .sub { font-family: var(--body); font-weight: 700; font-size: 0.72rem; opacity: 0.85; }
.tog:active { transform: scale(0.95); }
#sunBtn[aria-pressed="true"] { background: var(--sun); border-color: var(--sun-deep); }
#rainBtn[aria-pressed="true"] { background: var(--rain); border-color: #1a5ec9; color: #fff; }
#turnBtn[aria-pressed="true"] { background: #ffe3c2; border-color: #f29a3a; }
#dropBtn { background: #e7f1ff; border-color: #b9d4fb; }
#eleBtn { background: #eef0f6; border-color: #b8c0d4; }
#eleBtn[aria-pressed="true"] { background: #9fdcff; border-color: #3aa0e0; }

.slider { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.6rem; }
.slider .end { display: flex; flex-direction: column; align-items: center; font-weight: 700; font-size: 0.8rem; color: var(--muted); min-width: 2.75rem; }
.slider .end b { font-size: 1.4rem; line-height: 1; }
.slider-mid { display: grid; gap: 0.1rem; min-width: 0; }
.slider-mid .row { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2.75rem; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track {
  height: 0.9rem; border-radius: 999px;
  background: linear-gradient(90deg, #ff9d5c 0%, #ffd27a 30%, #bfe3ff 60%, #7dbcf5 100%);
}
input[type=range]::-moz-range-track {
  height: 0.9rem; border-radius: 999px;
  background: linear-gradient(90deg, #ff9d5c 0%, #ffd27a 30%, #bfe3ff 60%, #7dbcf5 100%);
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 2.5rem; height: 2.5rem; margin-top: -0.8rem; border-radius: 50%;
  background: radial-gradient(circle at 40% 38%, #fff6c9 0 18%, var(--sun) 45%, var(--sun-deep) 100%);
  border: 0.19rem solid #fff; box-shadow: 0 0.12rem 0.5rem rgba(229,154,0,.6);
}
input[type=range]::-moz-range-thumb {
  width: 2.25rem; height: 2.25rem; border-radius: 50%;
  background: radial-gradient(circle at 40% 38%, #fff6c9 0 18%, var(--sun) 45%, var(--sun-deep) 100%);
  border: 0.19rem solid #fff; box-shadow: 0 0.12rem 0.5rem rgba(229,154,0,.6);
}
.drag-tip { text-align: center; font-size: 0.78rem; color: var(--muted); margin: -0.25rem 0 0; }

/* Phones upright: one-line title, short language label */
@media (max-width: 480px) {
  .brand h1 { font-size: clamp(1.15rem, 6vw, 1.5rem); }
  .brand p { font-size: 0.82rem; }
  .top-actions { gap: 0.35rem; margin-left: auto; }
  .top { flex-wrap: wrap; row-gap: 0.4rem; }   /* the buttons move under the title when it would not fit beside them */
  .brand { flex: 1 1 10rem; }
  .tray { padding: 0.6rem; }
  .toggles { gap: 0.3rem; }
  .tog { font-size: 0.68rem; min-height: 4.2rem; border-radius: 0.9rem; }
  .tog .ic { font-size: 1.6rem; }
  .tog .sub { font-size: 0.66rem; }
  .msg { font-size: 1.05rem; }
  .hint { padding: 0.55rem 0.7rem; gap: 0.45rem; border-radius: 1.1rem; }
  .hear { width: 2.6rem; height: 2.6rem; font-size: 1.2rem; }
  .check .dot { width: 1.2rem; height: 1.2rem; font-size: 0.7rem; }
  .check { padding: 0.15rem 0.45rem 0.15rem 0.2rem; font-size: 0.75rem; }
  .legend { flex-wrap: nowrap; gap: 0.25rem; }
  .legend button { flex: 1 1 0; min-width: 0; padding: 0.2rem 0.1rem; font-size: 0.72rem; min-height: 1.9rem; border-radius: 0.6rem; white-space: nowrap; }
  .drag-tip { display: none; }
}
@media (min-width: 481px) { .check .t { display: inline; } .lang-long { display: inline; } .lang-short { display: none; } }

/* Wide screens: hint top-left, tray bottom-right, rainbow and child in the clear */
@media (min-aspect-ratio: 6/5) {
  .overlay-top { align-items: flex-start; }
  .hint { width: min(28rem, 40vw); }
  .controls { justify-content: flex-end; }
  .tray { width: min(38rem, 56vw); }
  .chip-btn .lbl { display: inline; }
  #fsBtn, #cleanBtn { display: inline-flex; }
}
/* Phones sideways and other short wide screens: same corners, compact */
@media (min-aspect-ratio: 6/5) and (max-height: 560px) {
  html { font-size: 13px; }
  .overlay-top { padding-top: calc(env(safe-area-inset-top, 0px) + 0.5rem); gap: 0.4rem; }
  .brand h1 { font-size: 1.8rem; }
  .brand p { font-size: 0.85rem; }
  .chip-btn .lbl { display: none; }
  .lang-long { display: none; } .lang-short { display: inline; }
  #cleanBtn { display: none; }
  .hint { width: min(24rem, 44vw); padding: 0.55rem 0.75rem; gap: 0.4rem; }
  .checks { display: none; }
  .msg { font-size: 1.1rem; }
  .hear { width: 2.75rem; height: 2.75rem; font-size: 1.25rem; }
  .legend button { font-size: 0.85rem; min-height: 1.9rem; padding: 0.2rem 0.5rem; }
  .controls { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.5rem); }
  .tray { width: min(34rem, 52vw); padding: 0.5rem; gap: 0.3rem; }
  .tog { min-height: 3.6rem; font-size: 0.85rem; }
  .tog .ic { font-size: 1.4rem; }
  input[type=range] { height: 2.4rem; }
  .slider .end b { font-size: 1.1rem; }
  .drag-tip { display: none; }
}
/* Teacher's clean view: only the scene, title and top buttons */
#app.clean .hint, #app.clean .controls { display: none !important; }

/* Sheets */
.sheet {
  position: absolute; inset: 0; background: rgba(20, 28, 56, 0.55);
  display: flex; align-items: center; justify-content: center; padding: var(--gut); z-index: 10;
}
.card {
  background: var(--panel-solid); border-radius: 1.6rem; width: min(48rem, 100%); max-height: 100%;
  overflow: auto; padding: 1rem; display: grid; gap: 0.75rem; box-shadow: 0 0.75rem 2.5rem rgba(0,0,0,.3);
}
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
.card-head h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.1; }
.icon-btn { border: 0; background: #eef1f7; width: 2.75rem; height: 2.75rem; border-radius: 50%; font-size: 1.2rem; font-weight: 700; flex-shrink: 0; }
#dropCanvas { width: 100%; height: min(52vh, 28rem); border-radius: 1.1rem; display: block; background: #13204a; }
.caption { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.35rem; line-height: 1.25; min-height: 2.6em; text-wrap: balance; }
.steps { display: flex; gap: 0.4rem; }
.steps i { flex: 1; height: 0.4rem; border-radius: 0.2rem; background: #e2e6ef; transition: background .3s; }
.steps i.on { background: var(--rain); }
.drop-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
.drop-foot p { margin: 0; color: var(--muted); font-size: 0.95rem; flex: 1 1 15rem; min-width: 0; }
.big-btn { border: 0; background: var(--rain); color: #fff; font-family: var(--display); font-weight: 800; font-size: 1.1rem; border-radius: 1rem; min-height: 3rem; padding: 0 1.4rem; }
.grown p { margin: 0; line-height: 1.6; max-width: 65ch; }
.grown .fact { display: grid; gap: 0.6rem; }
.grown h3 { margin: 0.4rem 0 0; font-family: var(--display); font-weight: 800; font-size: 1.15rem; }
.grown .num { font-variant-numeric: tabular-nums; font-weight: 700; }
.grown kbd { font-family: var(--body); font-weight: 700; background: #eef1f7; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 0.35rem; padding: 0 0.4rem; }
/* Drop sheet on short screens: canvas beside the words */
@media (max-height: 560px) and (min-aspect-ratio: 6/5) {
  .card { grid-template-columns: 1.3fr 1fr; align-items: start; }
  .card-head, .grown .fact { grid-column: 1 / -1; }
  #dropCanvas { height: calc(100vh - 7rem); grid-row: 2 / span 3; }
  .grown { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <canvas id="scene" aria-label="3D meadow where a child watches the sky"></canvas>

  <div class="overlay-top">
  <header class="top">
    <div class="brand">
      <h1 id="title" aria-live="off"></h1>
      <p data-i="tagline"></p>

    <div class="legend" id="legend" hidden></div>
  </section>
  </div>

  <nav class="controls">
    <div class="tray">

        <button class="tog" id="sunBtn" aria-pressed="true"><span class="ic" aria-hidden="true">☀️</span><span data-i="sun"></span></button>

    </div>
  </div>
</div>

<script>
(() => {
/* ---------- words ---------- */
const COLORS = ['#e8322b','#f58a00','#f2c200','#22a553','#1f6ff0','#4b3fcf','#9b39d6'];

      sprayVel[o + 1] = (0.45 + (Math.random() - 0.5) * 0.3) * sp;
      sprayVel[o + 2] = (-0.55 + (Math.random() - 0.5) * 0.3) * sp;
    }
    emitAcc = Math.min(emitAcc, 5);
  }
  let alive = 0, mx = 0, my = 0, mz = 0;
  for (let i = 0; i < SPRAY; i++) {
    if (!sprayAlive[i]) continue;
    const o = i * 3;
    sprayVel[o + 1] -= 9.8 * dt;
    sprayPos[o] += sprayVel[o] * dt; sprayPos[o + 1] += sprayVel[o + 1] * dt; sprayPos[o + 2] += sprayVel[o + 2] * dt;
    if (sprayPos[o + 1] < 0) { sprayAlive[i] = 0; sprayPos[o + 1] = -100; continue; }
    alive++; mx += sprayPos[o]; my += sprayPos[o + 1]; mz += sprayPos[o + 2];
  }
  if (alive) { mistC.lerp(V(mx / alive, my / alive, mz / alive), 0.2); }
  sprayGeo.attributes.position.needsUpdate = true;
  mistAmt = approach(mistAmt, Math.min(1, alive / 250), 5, dt);
  mistBow.position.copy(EYE).addScaledVector(anti, MIST_D);
  mistBow.lookAt(EYE);
  mistMat.uniforms.uMistC.value.copy(mistC);
  mistMat.uniforms.uAlpha.value = mistAmt * anim.sun * (state.el < 42 ? 1 : 0) * 0.95;
  mistBow.visible = mistMat.uniforms.uAlpha.value > 0.005;

  // Camera orbits the child; rain view looks away from the sun, sun view looks at it
  const e = sstep(anim.face);
  const phi = Math.PI * e + 0.32 + userYaw * 0.15;
  const r = 6.8;
  camera.position.set(Math.sin(phi) * r, 2.5 - 0.2 * e, Math.cos(phi) * r);
  const pitchRain = camera.aspect < 0.8 ? 0.22 : 0.14, pitchSun = Math.min(anim.el, 55) * Math.PI / 180 * 0.85;
  const pitch = pitchRain + (pitchSun - pitchRain) * e;
  const baseYaw = camera.aspect < 0.8 ? -0.17 : camera.aspect < 1.2 ? -0.1 : 0;   // narrow screens: turn a little left so Elephant stays in view
  const yaw = Math.PI * e + userYaw + baseYaw * (1 - e);
  const dir = V(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch));
  camera.lookAt(camera.position.clone().add(dir));

  // Little bounce when the rainbow is showing and the child can see it
  const mistOn = state.spraying && state.sunOut && state.el < 42;
  const joy = (bowOn || mistOn) && !state.facing ? 1 : 0;
  kid.position.y = joy * Math.abs(Math.sin(now / 260)) * 0.08;
  armL.rotation.z = -0.35 - joy * 0.9; armR.rotation.z = 0.35 + joy * 0.9;
  const flap = Math.sin(now / 140) * (0.15 + 0.35 * joy);
  earL.rotation.y = -flap; earR.rotation.y = flap;
  tail.rotation.z = Math.sin(now / 200) * 0.4;
  ele.position.y = 0 + joy * Math.abs(Math.sin(now / 300)) * 0.06;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ---------- inside a raindrop ---------- */
const dc = $('dropCanvas'), dctx = dc.getContext('2d');
let dropStep = 0, dropStart = 0, dropRaf = 0;
const DROP_T = [1.6, 1.6, 1.4, 1.8];
function refract(d, n, eta) {
  const ci = -(d[0] * n[0] + d[1] * n[1]), k = 1 - eta * eta * (1 - ci * ci), f = eta * ci - Math.sqrt(Math.max(k, 0));
  const v = [eta * d[0] + f * n[0], eta * d[1] + f * n[1]], l = Math.hypot(v[0], v[1]); return [v[0] / l, v[1] / l];
}
const hit = (P, d) => { const s = -2 * (P[0] * d[0] + P[1] * d[1]); return [P[0] + d[0] * s, P[1] + d[1] * s]; };
function dropPaths(R) {
  const b = 0.86 * R, P1 = [-Math.sqrt(R * R - b * b), b];
  return COLORS.map((col, k) => {
    const n = 1.331 + (k / 6) * 0.13;                     // real spread is 1.331–1.343; widened ~10× so kids can see it
    const t = refract([1, 0], [P1[0] / R, P1[1] / R], 1 / n);
    const P2 = hit(P1, t), n2 = [P2[0] / R, P2[1] / R], dd = t[0] * n2[0] + t[1] * n2[1];
    const rr = [t[0] - 2 * dd * n2[0], t[1] - 2 * dd * n2[1]];
    const P3 = hit(P2, rr), o = refract(rr, [-P3[0] / R, -P3[1] / R], n);
    return { col, P1, P2, P3, o };
  });
}
function sizeDrop() {
  const r = dc.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  dc.width = Math.round(r.width * dpr); dc.height = Math.round(r.height * dpr);
  dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { w: r.width, h: r.height };
}
function seg(ctx, a, b, f) { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f); ctx.stroke(); }
function drawDrop(t) {
  const { w, h } = sizeDrop.cache;
  const ctx = dctx, R = Math.min(w, h) * 0.25, cx = w * 0.6, cy = h * 0.4;
  const X = (p) => [cx + p[0], cy - p[1]];
  const L = T[ui()];
  ctx.clearRect(0, 0, w, h);
  const bg = ctx.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#1d3270'); bg.addColorStop(1, '#0f1a3d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  // sun
  const sy = cy - 0.86 * R;
  const sg = ctx.createRadialGradient(0, sy, 0, 0, sy, R * 0.7); sg.addColorStop(0, '#fff7cf'); sg.addColorStop(0.45, '#ffc83a'); sg.addColorStop(1, 'rgba(255,200,58,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(0, sy, R * 0.7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffe9a8'; ctx.font = `800 ${Math.max(14, R * 0.15)}px ${getComputedStyle(document.body).getPropertyValue('--display')}`;
  ctx.fillText(L.sunLabel, 10, sy - R * 0.2 - 6);
  // drop
  const dg = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.1, cx, cy, R);
  dg.addColorStop(0, 'rgba(210,235,255,0.55)'); dg.addColorStop(1, 'rgba(120,180,255,0.25)');
  ctx.fillStyle = dg; ctx.strokeStyle = 'rgba(200,230,255,0.9)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(cx - R * 0.45, cy - R * 0.45, R * 0.12, R * 0.07, -0.7, 0, Math.PI * 2); ctx.fill();

  const paths = dropPaths(R);
  const tt = [0, ...DROP_T.map((_, i) => DROP_T.slice(0, i + 1).reduce((a, b) => a + b, 0))];
  const part = (i) => Math.max(0, Math.min(1, (t - tt[i]) / DROP_T[i]));
  const p0 = part(0), p1 = part(1), p2 = part(2), p3 = part(3);
  dropStep = t < tt[1] ? 0 : t < tt[2] ? 1 : t < tt[3] ? 2 : 3;

  ctx.lineCap = 'round';
  // white beam
  ctx.shadowColor = '#fff'; ctx.shadowBlur = 16; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 8;
  const P1c = X(paths[0].P1);
  seg(ctx, [0, P1c[1]], P1c, p0);
  ctx.shadowBlur = 10;
  // exit length that keeps the face on the canvas
  const ex = paths[3], P3c = X(ex.P3), od = [ex.o[0], -ex.o[1]];
  const margin = R * 0.5;
  const lenX = od[0] < 0 ? (P3c[0] - margin) / -od[0] : 1e9, lenY = od[1] > 0 ? (h - margin - P3c[1]) / od[1] : 1e9;
  const len = Math.max(R * 0.6, Math.min(R * 2, lenX, lenY));

    ctx.strokeStyle = p.col; ctx.shadowColor = p.col; ctx.lineWidth = 3.5;

    ctx.fillStyle = '#3a2618'; ctx.beginPath(); ctx.arc(fx, fy - fr * 0.1, fr * 1.02, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    ctx.fillStyle = '#1c2547';
    ctx.beginPath(); ctx.arc(fx - fr * 0.35 + od[0] * -fr * 0.1, fy + fr * 0.05, fr * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(fx + fr * 0.35 + od[0] * -fr * 0.1, fy + fr * 0.05, fr * 0.13, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#c0504d'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(fx, fy + fr * 0.3, fr * 0.3, 0.2, Math.PI - 0.2); ctx.stroke();

function showStep() {
  $('dropCaption').textContent = T[ui()].d[dropStep];
  [...$('steps').children].forEach((el, i) => el.classList.toggle('on', i <= dropStep));
}
function playDrop() {
  cancelAnimationFrame(dropRaf);
  sizeDrop.cache = sizeDrop();
  dropStart = performance.now();
  const total = DROP_T.reduce((a, b) => a + b, 0) + 0.4;
  let shown = -1;
  const tick = (now) => {
    const t = reduce ? total : (now - dropStart) / 1000;
    drawDrop(Math.min(t, total));
    if (dropStep !== shown) { if (shown !== -1) sayKey((L) => L.d[dropStep]); shown = dropStep; showStep(); }
    if (t < total && !$('dropView').hidden) dropRaf = requestAnimationFrame(tick);
  };
  dropRaf = requestAnimationFrame(tick);
}
$('dropBtn').onclick = () => { audio(); $('dropView').hidden = false; sayKey((L) => L.d[0]); requestAnimationFrame(playDrop); };
$('dropReplay').onclick = () => { sayKey((L) => L.d[0]); playDrop(); };
$('dropClose').onclick = () => { $('dropView').hidden = true; cancelAnimationFrame(dropRaf); try { speechSynthesis.cancel(); } catch (e) {} };
$('dropView').onclick = (e) => { if (e.target.id === 'dropView') $('dropClose').onclick(); };
addEventListener('resize', () => { if (!$('dropView').hidden) { sizeDrop.cache = sizeDrop(); drawDrop(99); } });
addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('grownView').hidden = true; if (!$('dropView').hidden) $('dropClose').onclick(); } });

applyLang();
requestAnimationFrame(frame);
})();
